[tool.poetry]
name = "langchain-unstructured"
version = "1.0.1"
description = "An integration package connecting Unstructured and LangChain"
authors = []
readme = "README.md"
repository = "https://github.com/langchain-ai/langchain-unstructured"
license = "MIT"

[tool.poetry.urls]
"Source Code" = "https://github.com/langchain-ai/langchain-unstructured/tree/main/libs/unstructured"
"Release Notes" = "https://github.com/langchain-ai/langchain-unstructured/releases"

[tool.poetry.dependencies]
python = ">=3.10.0,<4.0.0"
# GHSA-2g6r-c272-w58r, GHSA-926x-3r5x-gfhw, GHSA-pjwx-r37v-7724,
# GHSA-qh6h-p6c9-ff54: langchain-core < 1.3.3 has SSRF, prompt validation,
# unsafe deserialization, and path traversal vulnerabilities.
langchain-core = ">=1.3.3,<2.0.0"
unstructured-client = { version = ">=0.27.0,<1" }
# CVE-2026-71428: unstructured < 0.24.0 is vulnerable to SSRF.
unstructured = { version = ">=0.24.0,<0.28.0", optional = true, python = ">=3.11,<3.13", extras = [
  "all-docs",
] }
# PYSEC-2026-2132: click < 8.3.3 is vulnerable.
# Remove once upstream deps require >= 8.3.3.
click = ">=8.3.3"
# CVE-2024-56201, CVE-2024-56326, CVE-2025-27516: jinja2 <= 3.1.5 has sandbox breakout vulnerabilities.
# Remove once upstream deps require >= 3.1.6.
jinja2 = ">=3.1.6"
# CVE-2024-47081: requests < 2.32.4 leaks .netrc credentials via malicious URLs.
# Remove once upstream deps require >= 2.32.4.
requests = ">=2.32.4"
# CVE-2025-66034: fonttools >= 4.33.0, < 4.60.2 has arbitrary file write and XML injection vulnerabilities.
# Remove once upstream deps require >= 4.60.2.
fonttools = ">=4.60.2"
# CVE-2025-68480: marshmallow >= 3.0.0rc1, < 3.26.2 has DoS in Schema.load(many).
# Remove once upstream deps require >= 3.26.2.
marshmallow = ">=3.26.2"
# CVE-2025-68146, CVE-2026-22701: filelock < 3.20.3 has TOCTOU symlink vulnerabilities.
# Remove once upstream deps require >= 3.20.3.
filelock = ">=3.20.3"
# CVE-2026-25528: langsmith >= 0.4.10, < 0.6.3 is vulnerable to SSRF via tracing header injection.
# Remove once upstream deps require >= 0.6.3.
langsmith = ">=0.6.3"
# GHSA-5wmx-573v-2qwq: markdown < 3.8.1 has an uncaught exception vulnerability.
# Remove once upstream deps require >= 3.8.1.
markdown = ">=3.8.1"
# GHSA-f83h-ghpp-7wcc, GHSA-wf5f-4jwr-ppcp: pdfminer-six < 20251230 has unsafe deserialization vulnerabilities.
# Remove once upstream deps require >= 20251230.
pdfminer-six = ">=20251230"
# PYSEC-2026-2248: pi-heif < 1.3.0 is vulnerable.
# Remove once upstream deps require >= 1.3.0.
pi-heif = ">=1.3.0"
# PYSEC-2026-2253, PYSEC-2026-2254, PYSEC-2026-2255, PYSEC-2026-2256, PYSEC-2026-2257: pillow < 12.3.0 is vulnerable.
# Remove once upstream deps require >= 12.3.0.
pillow = ">=12.3.0"
# GHSA-5239-wwwm-4pmq: pygments < 2.20.0 has a ReDoS vulnerability.
# Remove once upstream deps require >= 2.20.0.
pygments = ">=2.20.0"
# PYSEC-2026-3447: setuptools < 83.0.0 is vulnerable.
# Remove once upstream deps require >= 83.0.0.
setuptools = ">=83.0.0"
# GHSA-rrmf-rvhw-rf47: torch <= 2.12.0 has a memory corruption vulnerability.
# Remove once upstream deps require > 2.12.0.
torch = { version = ">2.12.0", optional = true, python = "<3.13" }

[tool.poetry.extras]
local = ["unstructured", "torch"]

[tool.poetry.group.test]
optional = true

[tool.poetry.group.test.dependencies]
pytest = "^9.0.1"
pytest-asyncio = "^1.3.0"
pytest-socket = ">=0.7,<0.9"
# TODO: hack to fix 3.9 builds
cffi = [{version = "<2.1.2", python="<3.10"}, {version = "*", python=">=3.10"}]
langchain-core = {git = "https://github.com/langchain-ai/langchain.git", subdirectory = "libs/core"}

[tool.poetry.group.codespell]
optional = true

[tool.poetry.group.codespell.dependencies]
codespell = "^2.2.6"

[tool.poetry.group.test_integration]
optional = true

[tool.poetry.group.test_integration.dependencies]

[tool.poetry.group.lint]
optional = true

[tool.poetry.group.lint.dependencies]
ruff = ">=0.5,<0.17"
# TODO: hack to fix 3.9 builds
cffi = [{version = "<2.1.2", python="<3.10"}, {version = "*", python=">=3.10"}]

[tool.poetry.group.typing.dependencies]
mypy = ">=1.7.1,<3.0.0"
unstructured = { version = ">=0.24.0,<0.28.0", python = ">=3.11,<3.13", extras = ["all-docs"] }
langchain-core = {git = "https://github.com/langchain-ai/langchain.git", subdirectory = "libs/core"}

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
langchain-core = {git = "https://github.com/langchain-ai/langchain.git", subdirectory = "libs/core"}

[tool.ruff.lint]
select = [
  "E",    # pycodestyle
  "F",    # pyflakes
  "I",    # isort
  "T201", # print
]

[tool.mypy]
disallow_untyped_defs = "True"

[tool.coverage.run]
omit = ["tests/*"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
# --strict-markers will raise errors on unknown marks.
# https://docs.pytest.org/en/7.1.x/how-to/mark.html#raising-errors-on-unknown-marks
#
# https://docs.pytest.org/en/7.1.x/reference/reference.html
# --strict-config       any warnings encountered while parsing the `pytest`
#                       section of the configuration file raise errors.
#
# https://github.com/tophat/syrupy
# --snapshot-warn-unused    Prints a warning on unused snapshots rather than fail the test suite.
addopts = "--strict-markers --strict-config --durations=5"
# Registering custom markers.
# https://docs.pytest.org/en/7.1.x/example/markers.html#registering-markers
markers = [
  "compile: mark placeholder test used to compile integration tests without running them",
  "local: mark tests as requiring a local install, which isn't compatible with CI currently",
]
asyncio_mode = "auto"
